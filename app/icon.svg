<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <mask id="sliceMask">
      <rect width="512" height="512" fill="white" />
      <!-- Diagonal slice cutting through the T stem and separating the S tail -->
      <line x1="50" y1="500" x2="380" y2="170" stroke="black" stroke-width="32" />
    </mask>
  </defs>
  
  <text 
    mask="url(#sliceMask)" 
    x="48%" 
    y="55%" 
    dominant-baseline="middle" 
    text-anchor="middle" 
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
    font-weight="900" 
    font-size="380" 
    fill="#DF6B47" 
    letter-spacing="-35"
  >
    TS
  </text>
</svg>
